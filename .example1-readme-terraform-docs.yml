---
formatter: "markdown table" # This is required.
header-from: ../../terraform-docs/tf_header.txt
footer-from: ../../terraform-docs/tf_footer.txt
sections:
  # hide: []
  show: []
  # hide-all: false # Deprecated in v0.13.0, removed in v0.15.0.
  # show-all: true # Deprecated in v0.13.0, removed in v0.15.0.
content: |-
  {{ .Header }}

  {{ .Requirements }}

  ```hcl
  {{ include "main.tf" }}
  ```

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Modules }}

  {{ .Footer }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- start_of_terraform_docs -->
    {{ .Content }}
    <!-- end_of_terraform_docs -->
output-values:
  enabled: false
  # from: terraform-docs/default_values.json # environment/default.tfvars
sort:
  enabled: true
  by: required
settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
