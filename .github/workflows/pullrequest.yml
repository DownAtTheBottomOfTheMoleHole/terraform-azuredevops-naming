---
name: 🧪 Pull Request Checks

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── PR title (commitlint) ─────────────────────────────────────────────────
  commitlint:
    name: Lint PR Title
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/commitlint.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      pull-requests: read

  # ─── Dependency review (PRs only, fork-safe) ───────────────────────────────
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/dependency-review.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      contents: read
      pull-requests: write

  # ─── PR labelling ──────────────────────────────────────────────────────────
  label-pr:
    name: Label PR
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/label-pr.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      contents: read
      pull-requests: write

  # ─── terraform-docs (check drift without mutating contributor branches) ────
  terraform-docs:
    name: terraform-docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.16.3" # required_version floor
          terraform_wrapper: false

      - name: Check generated output values
        run: python3 scripts/generate_docs_values.py --check

      - name: Check README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .readme-terraform-docs.yml
          fail-on-diff: true
          indention: 4
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Check TERRAFORM.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-terraform-docs.yml
          fail-on-diff: true
          indention: 4
          output-file: TERRAFORM.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Check examples/example1 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example1-readme-terraform-docs.yml
          fail-on-diff: true
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example1

      - name: Check examples/example2 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example2-readme-terraform-docs.yml
          fail-on-diff: true
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example2

  # ─── MegaLinter (changed files only on PR) ─────────────────────────────────
  megalinter:
    name: MegaLinter
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🧹 Run MegaLinter
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          APPLY_FIXES: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false

      - name: 📤 Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
            mega-linter.log
          retention-days: 7

  # ─── Publish the MegaLinter SARIF report when one is available ─────────────
  megalinter-sarif:
    name: Upload MegaLinter SARIF
    needs: megalinter
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download MegaLinter report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: megalinter-reports
          path: megalinter-artifacts

      - name: Prepare SARIF reports
        id: sarif
        shell: bash
        run: |
          sarif_dir="megalinter-artifacts/megalinter-reports/sarif"
          recognized=false

          if [ -f "$sarif_dir/REPOSITORY_SECRETLINT.sarif" ]; then
            echo "secretlint=true" >> "$GITHUB_OUTPUT"
            recognized=true
          fi
          if [ -f "$sarif_dir/REPOSITORY_TRIVY.sarif" ]; then
            echo "trivy=true" >> "$GITHUB_OUTPUT"
            recognized=true
          fi

          tflint_report="$sarif_dir/TERRAFORM_TFLINT.sarif"
          if [ -f "$tflint_report" ]; then
            tflint_runs="$(jq '.runs | length' "$tflint_report")"
            if [ "$tflint_runs" -gt 2 ]; then
              echo "Unexpected number of TFLint SARIF runs: $tflint_runs" >&2
              exit 1
            fi
            if [ "$tflint_runs" -ge 1 ]; then
              jq '.runs = [.runs[0]]' "$tflint_report" > "$sarif_dir/TERRAFORM_TFLINT_LINT.sarif"
              echo "tflint=true" >> "$GITHUB_OUTPUT"
              recognized=true
            fi
            if [ "$tflint_runs" -ge 2 ]; then
              jq '.runs = [.runs[1]]' "$tflint_report" > "$sarif_dir/TERRAFORM_TFLINT_ERRORS.sarif"
              echo "tflint_errors=true" >> "$GITHUB_OUTPUT"
              recognized=true
            fi
          fi

          if [ "$recognized" != "true" ]; then
            echo "No recognized SARIF reports were found in $sarif_dir" >&2
            exit 1
          fi

      - name: Upload SecretLint SARIF
        if: steps.sarif.outputs.secretlint == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/REPOSITORY_SECRETLINT.sarif
          category: megalinter-secretlint

      - name: Upload Trivy SARIF
        if: steps.sarif.outputs.trivy == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/REPOSITORY_TRIVY.sarif
          category: megalinter-trivy

      - name: Upload TFLint SARIF
        if: steps.sarif.outputs.tflint == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/TERRAFORM_TFLINT_LINT.sarif
          category: megalinter-tflint

      - name: Upload TFLint error SARIF
        if: steps.sarif.outputs.tflint_errors == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/TERRAFORM_TFLINT_ERRORS.sarif
          category: megalinter-tflint-errors

  # ─── Renovate auto-merge (eligible bot PRs, only after validation) ─────────
  auto-merge:
    name: Auto Merge Bots
    needs:
      - commitlint
      - dependency-review
      - label-pr
      - terraform-docs
      - megalinter
      - megalinter-sarif
      - release-planner-test
      - terraform-test
      - example-validate
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.commitlint.result == 'success' &&
      needs.dependency-review.result == 'success' &&
      needs.label-pr.result == 'success' &&
      needs.terraform-docs.result == 'success' &&
      needs.megalinter.result == 'success' &&
      needs.megalinter-sarif.result == 'success' &&
      needs.release-planner-test.result == 'success' &&
      needs.terraform-test.result == 'success' &&
      needs.example-validate.result == 'success'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/auto-merge.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      contents: write
      pull-requests: write

  # ─── Release planner tests ─────────────────────────────────────────────────
  release-planner-test:
    name: Release planner tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run release automation tests
        run: python3 -m unittest discover -s tests -p "test_release_*.py"

  # ─── terraform test (native HCL tests) ─────────────────────────────────────
  terraform-test:
    name: "terraform test (${{ matrix.terraform_version }})"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.14.0" # required_version floor
          - "latest"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform ${{ matrix.terraform_version }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test -verbose

      - name: Verify every naming-output boundary
        run: python3 -m unittest -v tests/test_naming_contract.py

  # ─── Validate the published-module examples ───────────────────────────────
  example-validate:
    name: "Validate ${{ matrix.example }}"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/example1
          - examples/example2
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.16.3" # required_version floor
          terraform_wrapper: false

      - name: Validate example against this checkout
        run: python3 scripts/validate_example.py "${{ matrix.example }}"
