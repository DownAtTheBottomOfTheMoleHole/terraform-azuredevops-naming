---
name: 🧪 Pull Request Checks

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_target:
    branches: [main, "release/**"]
    types: [opened]

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── PR title (commitlint) ─────────────────────────────────────────────────
  commitlint:
    name: Lint PR Title
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/commitlint.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      pull-requests: read

  # ─── Dependency review (PRs only, fork-safe) ───────────────────────────────
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/dependency-review.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      contents: read
      pull-requests: write

  # ─── PR labelling ──────────────────────────────────────────────────────────
  label-pr:
    name: Label PR
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/label-pr.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      contents: read
      pull-requests: write

  # ─── First-time contributor greeting ───────────────────────────────────────
  greet:
    name: Greet First-Time Contributors
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/greet.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      issues: write
      pull-requests: write

  # ─── terraform-docs (check drift without mutating contributor branches) ────
  terraform-docs:
    name: terraform-docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .readme-terraform-docs.yml
          fail-on-diff: true
          indention: 4
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Check TERRAFORM.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-terraform-docs.yml
          fail-on-diff: true
          indention: 4
          output-file: TERRAFORM.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Check examples/example1 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example1-readme-terraform-docs.yml
          fail-on-diff: true
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example1

      - name: Check examples/example2 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example2-readme-terraform-docs.yml
          fail-on-diff: true
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example2

  # ─── MegaLinter (changed files only on PR) ─────────────────────────────────
  megalinter:
    name: MegaLinter
    if: github.event_name == 'pull_request'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/megalinter.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      apply-fixes: none
      create-fix-pr: false
      validate-all: false

  # ─── Publish the MegaLinter SARIF report when one is available ─────────────
  megalinter-sarif:
    name: Upload MegaLinter SARIF
    needs: megalinter
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download MegaLinter report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: megalinter-reports
          path: megalinter-artifacts

      - name: Locate SARIF report
        id: sarif
        shell: bash
        run: |
          sarif_file="$(find megalinter-artifacts -type f -name '*.sarif' -print -quit 2>/dev/null || true)"
          if [ -n "$sarif_file" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF
        if: steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts
          category: megalinter

  # ─── terraform test (native HCL tests) ─────────────────────────────────────
  terraform-test:
    name: "terraform test (${{ matrix.terraform_version }})"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.14.0" # required_version floor
          - "latest"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform ${{ matrix.terraform_version }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test -verbose

  # ─── Validate the published-module examples ───────────────────────────────
  example-validate:
    name: "Validate ${{ matrix.example }}"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/example1
          - examples/example2
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.0" # required_version floor
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=${{ matrix.example }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.example }} validate
