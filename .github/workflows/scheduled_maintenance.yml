---
name: 🌙 Scheduled Maintenance

on:
  schedule:
    # Avoid the heavily contended top-of-hour scheduler window (UTC).
    - cron: "17 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── MegaLinter (full codebase) ────────────────────────────────────────────
  megalinter-nightly:
    name: MegaLinter (Full Codebase)
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/megalinter.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    with:
      apply-fixes: all
      create-fix-pr: true
      validate-all: true

  # ─── Publish the MegaLinter SARIF report when one is available ─────────────
  megalinter-sarif:
    name: Upload MegaLinter SARIF
    needs: megalinter-nightly
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download MegaLinter report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: megalinter-reports
          path: megalinter-artifacts

      - name: Locate SARIF report
        id: sarif
        shell: bash
        run: |
          sarif_file="$(find megalinter-artifacts -type f -name '*.sarif' -print -quit 2>/dev/null || true)"
          if [ -n "$sarif_file" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF
        if: steps.sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts
          category: megalinter

  # ─── terraform test (push to main + nightly) ───────────────────────────────
  terraform-test:
    name: "terraform test (${{ matrix.terraform_version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.14.0" # required_version floor
          - "latest"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform ${{ matrix.terraform_version }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test -verbose

  # ─── Validate the published-module examples ───────────────────────────────
  example-validate:
    name: "Validate ${{ matrix.example }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/example1
          - examples/example2
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.0" # required_version floor
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=${{ matrix.example }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.example }} validate

  # ─── Stale issues / PRs ────────────────────────────────────────────────────
  stale:
    name: Mark and Close Stale
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/stale.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      issues: write
      pull-requests: write

  # ─── OSSF Scorecard ────────────────────────────────────────────────────────
  scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/scorecard.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

  # ─── terraform-docs nightly refresh (one checkout, one bot PR) ─────────────
  terraform-docs-nightly:
    name: terraform-docs nightly
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: terraform-docs-nightly-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .readme-terraform-docs.yml
          git-push: false
          indention: 4
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Render TERRAFORM.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-terraform-docs.yml
          git-push: false
          indention: 4
          output-file: TERRAFORM.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Render examples/example1 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example1-readme-terraform-docs.yml
          git-push: false
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example1

      - name: Render examples/example2 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example2-readme-terraform-docs.yml
          git-push: false
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example2

      - name: Create pull request for docs updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/terraform-docs-nightly
          commit-message: "[terraform-docs] nightly refresh"
          title: "[Terraform-docs] Nightly refresh"
          body: |
            Automated terraform-docs refresh from scheduled maintenance.
          labels: bot
          delete-branch: true
