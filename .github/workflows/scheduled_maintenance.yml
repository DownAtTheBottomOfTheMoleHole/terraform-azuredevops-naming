---
name: 🌙 Scheduled Maintenance

on:
  schedule:
    # Avoid the heavily contended top-of-hour scheduler window (UTC).
    - cron: "17 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Sync shared secrets to sister modules (only on push to main) ──────────
  secret-syncer:
    name: Sync secrets to other modules
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: jpoehnelt/secrets-sync-action@7840777f242539d96b60477b66aa1c179e7644ea # v1.10.0 # DevSkim: ignore DS117838
        with:
          secrets: |
            ^GIT_SSH_KEY$
            ^INFRACOST_API_KEY$
            ^PAT$
          repositories: |
            ^DownAtTheBottomOfTheMoleHole/terraform-best-practices-mcp$
            ^DownAtTheBottomOfTheMoleHole/terraform_module_template$
          dry_run: false
          github_token: ${{ secrets.SYNCER }}
          concurrency: 10
        env:
          # Required: secrets-sync-action reads values from the environment
          # before pushing them to target repos.
          GIT_SSH_KEY: ${{ secrets.GIT_SSH_KEY }} # zizmor: ignore[secrets-inherit]
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }} # zizmor: ignore[secrets-inherit]
          PAT: ${{ secrets.PAT }} # zizmor: ignore[secrets-inherit]
          # Authentication only: excluded from the secrets selector above.
          SYNCER: ${{ secrets.SYNCER }} # zizmor: ignore[secrets-inherit]

  # ─── MegaLinter (full codebase) ────────────────────────────────────────────
  megalinter-nightly:
    name: MegaLinter (Full Codebase)
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/megalinter.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # The pinned reusable workflow declares this permission. Keep the caller
      # contract aligned even though .mega-linter.yml disables the reporter.
      statuses: write
    with:
      apply-fixes: all
      create-fix-pr: true
      validate-all: true

  # ─── Publish the MegaLinter SARIF report when one is available ─────────────
  megalinter-sarif:
    name: Upload MegaLinter SARIF
    needs: megalinter-nightly
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download MegaLinter report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: megalinter-reports
          path: megalinter-artifacts

      - name: Prepare SARIF reports
        id: sarif
        shell: bash
        run: |
          sarif_dir="megalinter-artifacts/megalinter-reports/sarif"
          recognized=false

          if [ -f "$sarif_dir/REPOSITORY_SECRETLINT.sarif" ]; then
            echo "secretlint=true" >> "$GITHUB_OUTPUT"
            recognized=true
          fi
          if [ -f "$sarif_dir/REPOSITORY_TRIVY.sarif" ]; then
            echo "trivy=true" >> "$GITHUB_OUTPUT"
            recognized=true
          fi

          tflint_report="$sarif_dir/TERRAFORM_TFLINT.sarif"
          if [ -f "$tflint_report" ]; then
            tflint_runs="$(jq '.runs | length' "$tflint_report")"
            if [ "$tflint_runs" -gt 2 ]; then
              echo "Unexpected number of TFLint SARIF runs: $tflint_runs" >&2
              exit 1
            fi
            if [ "$tflint_runs" -ge 1 ]; then
              jq '.runs = [.runs[0]]' "$tflint_report" > "$sarif_dir/TERRAFORM_TFLINT_LINT.sarif"
              echo "tflint=true" >> "$GITHUB_OUTPUT"
              recognized=true
            fi
            if [ "$tflint_runs" -ge 2 ]; then
              jq '.runs = [.runs[1]]' "$tflint_report" > "$sarif_dir/TERRAFORM_TFLINT_ERRORS.sarif"
              echo "tflint_errors=true" >> "$GITHUB_OUTPUT"
              recognized=true
            fi
          fi

          if [ "$recognized" != "true" ]; then
            echo "No recognized SARIF reports were found in $sarif_dir" >&2
            exit 1
          fi

      - name: Upload SecretLint SARIF
        if: steps.sarif.outputs.secretlint == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/REPOSITORY_SECRETLINT.sarif
          category: megalinter-secretlint

      - name: Upload Trivy SARIF
        if: steps.sarif.outputs.trivy == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/REPOSITORY_TRIVY.sarif
          category: megalinter-trivy

      - name: Upload TFLint SARIF
        if: steps.sarif.outputs.tflint == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/TERRAFORM_TFLINT_LINT.sarif
          category: megalinter-tflint

      - name: Upload TFLint error SARIF
        if: steps.sarif.outputs.tflint_errors == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: megalinter-artifacts/megalinter-reports/sarif/TERRAFORM_TFLINT_ERRORS.sarif
          category: megalinter-tflint-errors

  # ─── terraform test (push to main + nightly) ───────────────────────────────
  terraform-test:
    name: "terraform test (${{ matrix.terraform_version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.14.0" # required_version floor
          - "latest"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform ${{ matrix.terraform_version }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test -verbose

      - name: Verify every naming-output boundary
        run: python3 -m unittest -v tests/test_naming_contract.py

  # ─── Validate the published-module examples ───────────────────────────────
  example-validate:
    name: "Validate ${{ matrix.example }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/example1
          - examples/example2
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.16.3" # required_version floor
          terraform_wrapper: false

      - name: Validate example against this checkout
        run: python3 scripts/validate_example.py "${{ matrix.example }}"

  # ─── Stale issues / PRs ────────────────────────────────────────────────────
  stale:
    name: Mark and Close Stale
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/stale.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      issues: write
      pull-requests: write

  # ─── OSSF Scorecard ────────────────────────────────────────────────────────
  scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'push'
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/scorecard.yml@8044b6ab0eab9e24684f61367991cc97ef43aa17 # main
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

  # ─── terraform-docs nightly refresh (one checkout, one bot PR) ─────────────
  terraform-docs-nightly:
    name: terraform-docs nightly
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: terraform-docs-nightly-${{ github.repository }}
      cancel-in-progress: false
    # create-pull-request uses GITHUB_TOKEN for both the branch and pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.16.3" # required_version floor
          terraform_wrapper: false

      - name: Refresh generated output values
        run: python3 scripts/generate_docs_values.py --write

      - name: Render README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .readme-terraform-docs.yml
          git-push: false
          indention: 4
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Render TERRAFORM.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-terraform-docs.yml
          git-push: false
          indention: 4
          output-file: TERRAFORM.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: .

      - name: Render examples/example1 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example1-readme-terraform-docs.yml
          git-push: false
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example1

      - name: Render examples/example2 README.md
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: ../../.example2-readme-terraform-docs.yml
          git-push: false
          indention: 1
          output-file: README.md
          recursive: false
          template: "<!-- start_of_terraform_docs -->\n{{ .Content }}\n<!-- end_of_terraform_docs -->"
          working-dir: examples/example2

      - name: Create pull request for docs updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/terraform-docs-nightly
          commit-message: "docs: refresh generated Terraform documentation"
          title: "docs: refresh generated Terraform documentation"
          body: |
            Automated terraform-docs refresh from scheduled maintenance.
          labels: bot
          delete-branch: true
