name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "Releases must be dispatched from a tag, not $RELEASE_REF_TYPE '$RELEASE_TAG'." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not valid SemVer prefixed with v." >&2
            exit 1
          fi

      - name: ⬇️ Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release provenance and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA is not reachable from main." >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          if ! grep -Fq "## [$release_version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Validate release candidate
        shell: bash
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  release:
    needs: release-gate
    uses: DownAtTheBottomOfTheMoleHole/.github/.github/workflows/auto-release.yml@283bf13cac587920f45291bd51a21040bf7aaa83 # main
    permissions:
      contents: write
