name: 🚀 Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# A newer queued run safely covers every unreleased first-parent commit. Keeping
# one release writer prevents two runs from racing to create the same tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-and-validate:
    name: Plan and validate releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_items: ${{ steps.plan.outputs.has_items }}
      plan: ${{ steps.plan.outputs.plan }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
    steps:
      - name: ⬇️ Checkout release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and immutable tag history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --prune --tags origin

      - name: Select and check out the exact release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_target="$GITHUB_SHA"
          else
            release_target="refs/remotes/origin/main"
          fi

          target_sha="$(git rev-parse --verify "${release_target}^{commit}")"
          git checkout --force --detach "$target_sha"
          git clean -f -f -d -x

          if [ "$(git rev-parse HEAD)" != "$target_sha" ]; then
            echo "Checked-out planner revision does not match release target $target_sha." >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Test release planner
        shell: bash
        run: python3 -m unittest discover -s tests -p "test_release_*.py"

      - name: Build release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/release-plan.json"
          python3 scripts/release_plan.py \
            --target "$RELEASE_TARGET" \
            --main refs/remotes/origin/main \
            --repository "$GITHUB_REPOSITORY" > "$plan_file"

          plan_json="$(tr -d '\n' < "$plan_file")"
          item_count="$(jq '.items | length' "$plan_file")"
          {
            echo "plan=$plan_json"
            if [ "$item_count" -gt 0 ]; then
              echo "has_items=true"
            else
              echo "has_items=false"
            fi
            echo "target_sha=$(jq -r '.target_sha' "$plan_file")"
          } >> "$GITHUB_OUTPUT"

          jq . "$plan_file"

      - name: Setup Terraform
        if: steps.plan.outputs.has_items == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Validate every planned commit
        if: steps.plan.outputs.has_items == 'true'
        env:
          TF_IN_AUTOMATION: "true"
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/release-plan.json"
          release_shas_file="$RUNNER_TEMP/release-shas.txt"
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          declare -A validated=()

          if ! jq -e '.items | type == "array" and length > 0' "$plan_file" > /dev/null; then
            echo "The release plan contains no commits to validate." >&2
            exit 1
          fi
          jq -r '.items[].sha' "$plan_file" > "$release_shas_file"

          while IFS= read -r release_sha; do
            if [ -n "${validated[$release_sha]+present}" ]; then
              continue
            fi
            validated["$release_sha"]=true

            echo "Validating release commit $release_sha"
            git checkout --force --detach "$release_sha"
            git clean -f -f -d -x
            terraform fmt -check -recursive
            terraform init -backend=false -input=false
            terraform validate
            terraform test
            python3 -m unittest -v tests/test_naming_contract.py
            python3 scripts/generate_docs_values.py --check

            for example_dir in examples/example1 examples/example2; do
              python3 scripts/validate_example.py "$example_dir"
            done
          done < "$release_shas_file"

  publish:
    name: Publish immutable releases
    needs: plan-and-validate
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.plan-and-validate.outputs.has_items == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: ⬇️ Checkout release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and immutable tag history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --prune --tags origin

      - name: Check out the exact validated release target
        env:
          RELEASE_TARGET: ${{ needs.plan-and-validate.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse --verify "${RELEASE_TARGET}^{commit}")"
          git checkout --force --detach "$target_sha"
          git clean -f -f -d -x

          if [ "$(git rev-parse HEAD)" != "$target_sha" ]; then
            echo "Checked-out planner revision does not match validated target $target_sha." >&2
            exit 1
          fi

      - name: Rebuild and verify release plan
        env:
          EXPECTED_PLAN: ${{ needs.plan-and-validate.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ needs.plan-and-validate.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_plan="$RUNNER_TEMP/expected-release-plan.json"
          actual_plan="$RUNNER_TEMP/release-plan.json"
          printf '%s\n' "$EXPECTED_PLAN" > "$expected_plan"

          python3 scripts/release_plan.py \
            --target "$RELEASE_TARGET" \
            --main refs/remotes/origin/main \
            --repository "$GITHUB_REPOSITORY" > "$actual_plan"

          if ! cmp -s "$expected_plan" "$actual_plan"; then
            echo "Repository state changed after validation; refusing to publish." >&2
            diff -u <(jq -S . "$expected_plan") <(jq -S . "$actual_plan") || true
            exit 1
          fi

      - name: Create tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/release-plan.json"
          items_file="$RUNNER_TEMP/release-items.jsonl"

          if ! jq -e '.items | type == "array" and length > 0' "$plan_file" > /dev/null; then
            echo "The validated release plan contains no publishable items." >&2
            exit 1
          fi
          jq -c '.items[]' "$plan_file" > "$items_file"

          resolve_remote_tag_commit() {
            local tag_name="$1"
            local object_json object_sha object_type depth

            object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name")"
            object_sha="$(jq -r '.object.sha' <<< "$object_json")"
            object_type="$(jq -r '.object.type' <<< "$object_json")"
            depth=0

            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 10 ]; then
                echo "Tag $tag_name has too many nested annotated-tag objects." >&2
                return 1
              fi

              object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_sha="$(jq -r '.object.sha' <<< "$object_json")"
              object_type="$(jq -r '.object.type' <<< "$object_json")"
            done

            if [ "$object_type" != "commit" ]; then
              echo "Tag $tag_name ultimately identifies unsupported Git object type $object_type." >&2
              return 1
            fi

            printf '%s\n' "$object_sha"
          }

          while IFS= read -r item; do
            tag="$(jq -r '.tag' <<< "$item")"
            release_sha="$(jq -r '.sha' <<< "$item")"
            previous_tag="$(jq -r '.previous_tag // empty' <<< "$item")"
            ref_response="$RUNNER_TEMP/ref-$tag.json"
            ref_error="$RUNNER_TEMP/ref-$tag.err"

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              > "$ref_response" 2> "$ref_error"; then
              existing_sha="$(resolve_remote_tag_commit "$tag")"

              if [ "$existing_sha" != "$release_sha" ]; then
                echo "Tag $tag already identifies $existing_sha, not validated commit $release_sha." >&2
                exit 1
              fi
              echo "Tag $tag already identifies the validated commit."
            else
              if ! grep -q "HTTP 404" "$ref_error"; then
                cat "$ref_error" >&2
                exit 1
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" \
                -f sha="$release_sha" > /dev/null
              echo "Created immutable tag $tag at $release_sha."
            fi

            verified_sha="$(resolve_remote_tag_commit "$tag")"
            if [ "$verified_sha" != "$release_sha" ]; then
              echo "Tag $tag now identifies $verified_sha, not validated commit $release_sha." >&2
              exit 1
            fi

            release_response="$RUNNER_TEMP/release-$tag.json"
            release_error="$RUNNER_TEMP/release-$tag.err"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$release_response" 2> "$release_error"; then
              if [ "$(jq -r '.draft' "$release_response")" = "true" ] || \
                [ "$(jq -r '.prerelease' "$release_response")" = "true" ]; then
                echo "Existing release $tag is draft or prerelease; refusing to treat it as stable." >&2
                exit 1
              fi
              echo "Published release $tag already exists."
              continue
            fi
            if ! grep -q "HTTP 404" "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi

            release_arguments=(
              "$tag"
              --verify-tag
              --target "$release_sha"
              --title "$tag"
              --generate-notes
            )
            if [ -n "$previous_tag" ]; then
              release_arguments+=(--notes-start-tag "$previous_tag")
            fi
            gh release create "${release_arguments[@]}"
          done < "$items_file"
