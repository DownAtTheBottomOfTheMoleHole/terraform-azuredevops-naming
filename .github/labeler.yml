# PR Labeler configuration — DownAtTheBottomOfTheMoleHole org baseline
# https://github.com/actions/labeler
#
# Copy to .github/labeler.yml in each repo and customise as needed.
# The pinned actions/labeler workflow matches branch names and changed files;
# pull-request title policy is enforced separately by the commitlint job.

breaking-change:
  - head-branch:
      - "^breaking/"
      - "^breaking-change/"

feature:
  - head-branch:
      - "^feat/"
      - "^feature/"
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "lib/**"
          - "packages/**"

bug:
  - head-branch:
      - "^fix/"
      - "^bugfix/"
      - "^hotfix/"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/*.mdx"
          - "docs/**"
          - ".github/*.md"

dependencies:
  - head-branch:
      - "^deps/"
      - "^renovate/"
      - "^dependabot/"
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "yarn.lock"
          - "pnpm-lock.yaml"
          - "requirements*.txt"
          - "go.sum"
          - "Cargo.lock"
          - "pyproject.toml"

security:
  - head-branch:
      - "^security/"

maintenance:
  - head-branch:
      - "^chore/"
      - "^refactor/"
      - "^perf/"
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/*.yml"
          - ".github/*.yaml"
          - "**/.eslintrc*"
          - "**/.prettierrc*"
          - "**/.editorconfig"
          - "**/tsconfig*.json"
          - "**/.mega-linter.yml"
          - "**/*.config.js"
          - "**/*.config.ts"
          - "test/**"
          - "tests/**"
          - "__tests__/**"
          - "**/*.test.ts"
          - "**/*.spec.ts"
          - "**/*.test.js"
          - "**/*.spec.js"

ci:
  - head-branch:
      - "^ci/"
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - "Dockerfile*"
          - "docker-compose*.yml"
          - ".dockerignore"
