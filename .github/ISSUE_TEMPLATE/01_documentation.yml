name: Report a documentation issue
description: Report inaccurate, missing, or unclear module documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep the module documentation accurate. Generated input and output tables come from the Terraform source, so fixes may need to update source descriptions before regenerating documentation.

        Do not disclose a vulnerability in a public issue. Use [private vulnerability reporting](https://github.com/DownAtTheBottomOfTheMoleHole/terraform-azuredevops-naming/security/advisories/new) instead.

  - type: input
    id: documentation_location
    attributes:
      label: Documentation location
      description: Link to the file, section, Terraform Registry page, or relevant line.
      placeholder: "https://github.com/.../README.md#releases"
    validations:
      required: true

  - type: textarea
    id: current_problem
    attributes:
      label: What is wrong or unclear?
      description: Quote a short excerpt where useful and explain the problem.
    validations:
      required: true

  - type: textarea
    id: proposed_correction
    attributes:
      label: Suggested correction
      description: Describe the accurate wording, example, or missing information.
    validations:
      required: false

  - type: textarea
    id: supporting_references
    attributes:
      label: Supporting references
      description: Link to Terraform, Azure DevOps, provider, or repository documentation that supports the correction.
    validations:
      required: false

  - type: dropdown
    id: contribution_intent
    attributes:
      label: Would you like to submit the documentation fix?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
