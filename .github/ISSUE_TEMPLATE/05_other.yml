name: Other
description: Raise a module question or issue that does not fit the other forms.
title: "[Other]: "
body:
  - type: markdown
    attributes:
      value: |
        Choose the bug, documentation, enhancement, or repository form when one applies; their prompts help maintainers respond faster.

        **Do not disclose credentials or vulnerabilities here.** Report security issues privately through [GitHub Security Advisories](https://github.com/DownAtTheBottomOfTheMoleHole/terraform-azuredevops-naming/security/advisories/new).

  - type: dropdown
    id: issue_category
    attributes:
      label: Category
      options:
        - Usage question
        - Compatibility question
        - Community or project process
        - Other
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: Description
      description: Explain the question or issue and the outcome you need.
    validations:
      required: true

  - type: textarea
    id: relevant_context
    attributes:
      label: Relevant context
      description: Include affected module inputs or outputs, configuration, or environment details where applicable. Remove secrets and state data.
    validations:
      required: false

  - type: textarea
    id: supporting_references
    attributes:
      label: Supporting references
      description: Link to related documentation, issues, or pull requests.
    validations:
      required: false

  - type: dropdown
    id: contribution_intent
    attributes:
      label: Would you like to contribute a change?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
