name: Report a bug
description: Report incorrect naming output, validation, or module behaviour.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the module. Search existing issues before filing a duplicate.

        **Do not disclose credentials or vulnerabilities here.** Report security issues privately through [GitHub Security Advisories](https://github.com/DownAtTheBottomOfTheMoleHole/terraform-azuredevops-naming/security/advisories/new).

  - type: input
    id: terraform_version
    attributes:
      label: Terraform version
      description: Output of `terraform version` (Terraform Core only is sufficient).
      placeholder: "1.14.0"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module version
      description: The exact module version or Git commit used.
      placeholder: "11.0.5"
    validations:
      required: true

  - type: input
    id: random_provider_version
    attributes:
      label: Random provider version
      description: The selected `hashicorp/random` version from `.terraform.lock.hcl`.
      placeholder: "3.8.0"
    validations:
      required: true

  - type: textarea
    id: affected_interface
    attributes:
      label: Affected inputs or outputs
      description: List the module input and output names involved.
      placeholder: "Inputs: prefix, work_items\nOutputs: git_repository_feature_branch_slash"
    validations:
      required: true

  - type: textarea
    id: minimal_configuration
    attributes:
      label: Minimal Terraform configuration
      description: Provide the smallest configuration that reproduces the problem. Remove secrets, state data, and unrelated resources.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: Include the commands needed to observe the problem.
      placeholder: "1. terraform init\n2. terraform apply\n3. Inspect ..."
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: Describe the name, metadata, or validation result you expected.
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      description: Describe the observed result and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: diagnostic_output
    attributes:
      label: Relevant diagnostic output
      description: Paste only the relevant, redacted error or test output. Do not include credentials or Terraform state.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add related issues, vendor naming rules, or other details that may help investigation.
    validations:
      required: false

  - type: dropdown
    id: contribution_intent
    attributes:
      label: Would you like to submit a fix?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
