name: Repository or automation issue
description: Report a problem with CI, releases, labels, templates, or repository maintenance.
title: "[Repo]: "
labels: ["repository"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for repository automation and maintenance. Use the documentation form for wording or generated-reference problems.

        Do not disclose a vulnerability in a public issue. Use [private vulnerability reporting](https://github.com/DownAtTheBottomOfTheMoleHole/terraform-azuredevops-naming/security/advisories/new) instead.

  - type: dropdown
    id: repository_area
    attributes:
      label: Repository area
      options:
        - Pull-request checks
        - Release automation
        - Scheduled maintenance
        - Labels or templates
        - Dependency automation
        - Other repository maintenance
    validations:
      required: true

  - type: textarea
    id: current_behaviour
    attributes:
      label: Current behaviour
      description: Describe what is happening, including the relevant workflow run or file link.
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: Describe the behaviour you expected or the maintenance change you propose.
    validations:
      required: true

  - type: textarea
    id: reproduction_details
    attributes:
      label: Reproduction details
      description: Include event type, branch, relevant labels, and redacted logs when applicable.
    validations:
      required: false

  - type: textarea
    id: supporting_references
    attributes:
      label: Supporting references
      description: Link to relevant runs, GitHub documentation, issues, or pull requests.
    validations:
      required: false

  - type: dropdown
    id: contribution_intent
    attributes:
      label: Would you like to submit the repository change?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
