name: Request an enhancement
description: Propose a new naming definition, input, output, validation, or module capability.
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for improvements to the naming module. If an existing output is incorrect, use the bug form instead.

        Do not disclose a vulnerability in a public issue. Use [private vulnerability reporting](https://github.com/DownAtTheBottomOfTheMoleHole/terraform-azuredevops-naming/security/advisories/new) instead.

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the problem this change would solve for module consumers.
    validations:
      required: true

  - type: textarea
    id: affected_interface
    attributes:
      label: Affected or proposed inputs and outputs
      description: List existing names that would change or proposed public names to add.
      placeholder: "New output: serviceendpoint_example\nRelated inputs: prefix, suffix"
    validations:
      required: true

  - type: textarea
    id: proposed_behaviour
    attributes:
      label: Proposed behaviour
      description: Describe the expected name, slug, scope, length, and validation rules where applicable.
    validations:
      required: true

  - type: textarea
    id: potential_configuration
    attributes:
      label: Potential Terraform configuration
      description: Show how a consumer would use the enhancement. Remove secrets and unrelated resources.
      render: hcl
    validations:
      required: false

  - type: dropdown
    id: compatibility_impact
    attributes:
      label: Compatibility impact
      description: Select the closest expected impact on current consumers.
      options:
        - Additive and backward compatible
        - Changes existing behaviour or output shape
        - Unsure
    validations:
      required: true

  - type: textarea
    id: supporting_references
    attributes:
      label: Supporting references
      description: Link to Azure DevOps naming restrictions, provider documentation, related issues, or examples.
    validations:
      required: false

  - type: dropdown
    id: contribution_intent
    attributes:
      label: Would you like to submit this enhancement?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
