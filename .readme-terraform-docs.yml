  <!-- consuming terraform-azuredevops-naming -->
  ### Consuming terraform-azuredevops-naming

  Add the module to your Terraform configuration and pin an appropriate version range:

  ```hcl
  module "azdo_naming" {
    source  = "DownAtTheBottomOfTheMoleHole/naming/azuredevops"
    version = "{{ include "terraform-docs/module_version.txt" }}"

    prefix = ["dbmh"]
    suffix = ["my-project"]
  }
  ```

